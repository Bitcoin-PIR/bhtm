[package]
name = "blockhash-to-muhash"
version = "0.1.0"
edition = "2021"
description = "Slim MuHash builder over header-bound stripped block deltas"

[dependencies]
sha2 = "0.10"
hex = "0.4"
chacha20 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `libc` provides the ioctl wrapper for the SEV-SNP `/dev/sev-guest`
# guest-side attestation report fetch in `src/sev_snp_guest.rs`. Unix
# only; the module compiles to a no-op on non-Unix targets via
# `#[cfg(unix)]` so Windows builds still work (the SEV-SNP path is
# simply unavailable there).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# For MuHash 3072-bit arithmetic we implement a custom Num3072 type
# using [u64; 48] with fast pseudo-Mersenne reduction (p = 2^3072 - 1103717).
# No external bigint dependency needed — see src/num3072.rs.

[dev-dependencies]
tempfile = "3"
